AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI pinned by digest
Resources:
  Errors:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: Images
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:GetObjectVersion
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}/uploads/*
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}/processed/*
          - Effect: Allow
            Action: sqs:SendMessage
            Resource:
              Fn::GetAtt:
              - Errors
              - Arn
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - BatchQueue
              - Arn
  Function:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code:
        ImageUri:
          Ref: ImageUri
      Role:
        Fn::GetAtt:
        - Role
        - Arn
      Timeout: 30
      MemorySize: 512
      ReservedConcurrentExecutions: 2
      Architectures:
      - x86_64
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: Function
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}
  InvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName:
        Ref: Function
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination:
            Fn::GetAtt:
            - Errors
            - Arn
  Images:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
        - Event: s3:ObjectCreated:*
          Function:
            Fn::GetAtt:
            - Function
            - Arn
          Filter:
            S3Key:
              Rules:
              - Name: prefix
                Value: uploads/
    DependsOn:
    - Permission
    - InvokeConfig
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${Function}
      RetentionInDays: 7
  Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: Function
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  BatchDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  BatchQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - BatchDLQ
          - Arn
        maxReceiveCount: 3
  BatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code:
        ImageUri:
          Ref: ImageUri
      ImageConfig:
        Command:
        - handler.sqs_handler
      Role:
        Fn::GetAtt:
        - Role
        - Arn
      Timeout: 30
      MemorySize: 512
      ReservedConcurrentExecutions: 2
      Architectures:
      - x86_64
  BatchMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn:
        Fn::GetAtt:
        - BatchQueue
        - Arn
      FunctionName:
        Ref: BatchFunction
      BatchSize: 5
      MaximumBatchingWindowInSeconds: 1
      FunctionResponseTypes:
      - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: 2
  BatchLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${BatchFunction}
      RetentionInDays: 7
Outputs:
  Bucket:
    Value:
      Ref: Images
  Function:
    Value:
      Ref: Function
  Errors:
    Value:
      Ref: Errors
  BatchFunction:
    Value:
      Ref: BatchFunction
  BatchQueue:
    Value:
      Ref: BatchQueue
  BatchDLQ:
    Value:
      Ref: BatchDLQ
