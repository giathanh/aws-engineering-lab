services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: orders, POSTGRES_USER: orders, POSTGRES_PASSWORD: local-only}
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U orders'], interval: 3s, timeout: 3s, retries: 20}
    volumes: [db:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  app:
    build: {context: ., target: app}
    ports: ["127.0.0.1:8080:8080"]
    volumes: [reports:/var/www/app/storage/app]
    env_file: .env
    environment: &runtime
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: orders
      DB_USERNAME: orders
      DB_PASSWORD: local-only
      DB_SSLMODE: disable
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: database
    depends_on: {db: {condition: service_healthy}}
  nginx:
    build: {context: ., target: nginx}
    network_mode: service:app
    depends_on: [app]
  worker:
    build: {context: ., target: app}
    env_file: .env
    environment: *runtime
    volumes: [reports:/var/www/app/storage/app]
    command: [php, artisan, queue:work, '--sleep=2', '--timeout=60', '--tries=3']
    depends_on: {db: {condition: service_healthy}}
volumes:
  db:
  reports:
